<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'">
<title>B/S Reserve — независимый архив</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1220;color:#e4eaf4;font:15px/1.6 system-ui,sans-serif}header{padding:24px 32px;border-bottom:1px solid #283246}h1{font-size:22px;margin:0}small{color:#94a3ba}main{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 110px)}aside{padding:20px;border-right:1px solid #283246;overflow:auto}article{padding:26px 40px;overflow:auto}input{width:100%;padding:12px;background:#182137;color:inherit;border:1px solid #35415c;border-radius:9px}button,a{color:#6cdeca}button{display:block;text-align:left;padding:10px 8px;width:100%;border:0;background:none;font:inherit;cursor:pointer}.msg{border-top:1px solid #263247;padding:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.65 system-ui,sans-serif}.role{font-size:12px;color:#77d8c8;text-transform:uppercase}h2{font-size:23px}details{margin-top:26px}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}aside{max-height:40vh}article{padding:20px}}
</style><header><h1>B/S Reserve · Независимый архив</h1><small>Работает без аккаунта OpenAI и без сети. Все доступные ветви и версии сохранены в Vault.</small></header>
<main><aside><input id="q" placeholder="Поиск по всем текстам"><div id="list"></div></aside><article id="reader"><h2>Наша память — в твоих руках</h2><p>Выбери переписку слева. Память и инструкции находятся в Vault/knowledge, документы — в files.</p><div id="filelist"></div></article></main>
<script id="archive-data" type="application/json">__ARCHIVE_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('archive-data').textContent);
const list=document.getElementById('list'),reader=document.getElementById('reader');
function el(tag,text,cls){const x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x}
function show(c){reader.replaceChildren(el('h2',c.Title),el('small',c.ID+' · Версий: '+c.Versions));c.Messages.forEach(m=>{const b=el('section','','msg');b.append(el('div',m.Role||'Сообщение','role'),el('pre',m.Text));reader.append(b)})}
function render(){const q=document.getElementById('q').value.toLowerCase();list.replaceChildren();data.Chats.filter(c=>(c.Title+'\n'+c.Messages.map(m=>m.Text).join('\n')).toLowerCase().includes(q)).forEach(c=>{const b=el('button',c.Title);b.onclick=()=>show(c);list.append(b)})}
const details=el('details',''),summary=el('summary','Оригинальные файлы ('+data.Files.length+')');details.append(summary);
data.Files.forEach(f=>{const p=el('p',''),a=el('a',f.Name);a.href=f.Path;a.download=f.Name.split('/').pop();p.append(a);details.append(p)});
document.getElementById('filelist').append(details);document.getElementById('q').oninput=render;render();
</script></html>
