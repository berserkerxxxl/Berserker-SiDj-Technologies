name: SiDj - connect Telegram once
run-name: 'SiDj: подключение Telegram (один запуск)'

# One-time migration operation authorized by the owner. Workers Free was
# confirmed in successful manual deployment run 41110352761. Remove after success.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sidj-connect-once.yml']

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: edccc6a610313514ee2f77649264dcfb5cfab6fe
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/sidj-worker/package-lock.json
      - name: Test operations without credentials
        run: python3 -m unittest discover -s automation -p 'test_sidj_cloudflare.py' -v
      - name: Check Worker without credentials
        working-directory: cloudflare/sidj-worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run deploy:check

  operate:
    needs: check
    if: github.ref == 'refs/heads/main' && github.repository == 'berserkerxxxl/Berserker-SiDj-Technologies'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    # Same group as the old polling workflow: they never operate concurrently.
    concurrency:
      group: sidj-telegram-commands
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: edccc6a610313514ee2f77649264dcfb5cfab6fe
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/sidj-worker/package-lock.json
      - name: Install pinned deployment tooling
        working-directory: cloudflare/sidj-worker
        run: npm ci --ignore-scripts
      - name: Run selected Cloudflare operation
        env:
          SIDJ_OPERATION: activate
          SIDJ_FREE_PLAN_CONFIRMED: 'yes'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SIDJ_TELEGRAM_BOT_TOKEN: ${{ secrets.SIDJ_TELEGRAM_BOT_TOKEN }}
          SIDJ_TELEGRAM_CHAT_ID: ${{ secrets.SIDJ_TELEGRAM_CHAT_ID }}
          SIDJ_ADMIN_TOKEN: ${{ secrets.SIDJ_ADMIN_TOKEN }}
        run: |
          python3 automation/sidj_cloudflare.py "$SIDJ_OPERATION"
          python3 automation/sidj_cloudflare.py status
