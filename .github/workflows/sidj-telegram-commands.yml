
name: B/S tech - SiDj Telegram commands

on:
  # Cloudflare handles live commands. Manual fallback is kept for rollback only;
  # the script exits without getUpdates while the webhook is set.
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: sidj-telegram-commands
  cancel-in-progress: false

jobs:
  commands:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Process Telegram commands
        env:
          SIDJ_BOT_TOKEN: ${{ secrets.SIDJ_TELEGRAM_BOT_TOKEN }}
          SIDJ_CHAT_ID: ${{ secrets.SIDJ_TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 automation/sidj_telegram.py
