name: SiDj - Worker metrics (read only)

on:
  workflow_dispatch:
  # Bootstrap this owner-authorized read once; remove push after the report.
  push:
    branches: [main]
    paths: ['.github/workflows/sidj-worker-metrics.yml']

permissions:
  contents: read

concurrency:
  group: sidj-worker-metrics
  cancel-in-progress: false

jobs:
  metrics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: automation
      - name: Check metric parsing and credential safety without credentials
        run: python3 -m unittest discover -s automation -p 'test_sidj_cloudflare_metrics.py' -v
      - name: Read Cloudflare analytics without changing the Worker
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 automation/sidj_cloudflare_metrics.py
