name: B/S tech - SiDj Telegram notifications

on:
  workflow_run:
    workflows:
      - Test and Package B/S Reserve
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Notify SiDj in Russian
        env:
          SIDJ_BOT_TOKEN: ${{ secrets.SIDJ_TELEGRAM_BOT_TOKEN }}
          SIDJ_CHAT_ID: ${{ secrets.SIDJ_TELEGRAM_CHAT_ID }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          token = os.environ.get("SIDJ_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("SIDJ_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("Telegram не настроен: добавьте SIDJ_TELEGRAM_BOT_TOKEN и SIDJ_TELEGRAM_CHAT_ID в GitHub Actions secrets.")
              raise SystemExit(0)

          event_name = os.environ.get("GH_EVENT_NAME", "")
          now = datetime.now(ZoneInfo("Europe/Moscow")).strftime("%d.%m.%Y %H:%M")
          if event_name == "workflow_dispatch":
              message = "🤖 СиДжи | B/S tech\n✅ Тестовое уведомление работает.\n🕒 Москва: " + now
          else:
              with open(os.environ["GH_EVENT_PATH"], encoding="utf-8") as f:
                  event = json.load(f)
              run = event.get("workflow_run", {})
              conclusion = run.get("conclusion", "unknown")
              state = {
                  "success": "✅ Сборка успешно завершена",
                  "failure": "❌ Ошибка сборки",
                  "cancelled": "⚪ Сборка отменена",
                  "timed_out": "⏱ Превышено время сборки",
              }.get(conclusion, "ℹ️ Статус сборки: " + conclusion)
              message = (
                  "🤖 СиДжи | B/S tech\n"
                  "💾 B/S Reserve\n"
                  + state + "\n"
                  + "Ветка: " + str(run.get("head_branch", "неизвестно")) + "\n"
                  + "🕒 Москва: " + now + "\n"
                  + "Журнал: " + str(run.get("html_url", "ссылка недоступна"))
              )

          url = "https://api.telegram.org/bot" + token + "/sendMessage"
          body = json.dumps({"chat_id": chat_id, "text": message, "disable_web_page_preview": True}).encode("utf-8")
          req = Request(url, data=body, headers={"Content-Type": "application/json"}, method="POST")
          with urlopen(req, timeout=20) as resp:
              result = json.loads(resp.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError("Telegram отклонил сообщение")
          print("Сообщение успешно отправлено в Telegram.")
          PY
