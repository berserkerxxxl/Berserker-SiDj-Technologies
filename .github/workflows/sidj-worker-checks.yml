name: Check SiDj Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/sidj-worker/**'
      - 'automation/sidj*'
      - 'automation/*sidj*'
      - '.github/workflows/sidj-worker-checks.yml'
      - '.github/workflows/sidj-ai-telegram-notify.yml'
      - '.github/workflows/sidj-portfolio-ai-review.yml'
  pull_request:
    paths:
      - 'cloudflare/sidj-worker/**'
      - 'automation/*sidj*'
      - '.github/workflows/sidj-worker-checks.yml'
      - '.github/workflows/sidj-ai-telegram-notify.yml'
      - '.github/workflows/sidj-portfolio-ai-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/sidj-worker/package-lock.json
      - name: Scan public files for recognizable credentials
        run: python3 automation/check_sidj_secrets.py
      - name: Verify free AI agent safety without external API
        run: python3 -m unittest discover -s automation -p 'test_sidj_ai_agent.py' -v
      - name: Verify private AI notification safety without network
        run: python3 -m unittest discover -s automation -p 'test_sidj_ai_notify.py' -v
      - name: Verify multi-project AI audits offline
        run: python3 -m unittest discover -s automation -p 'test_sidj_portfolio_audit.py' -v
      - name: Verify polling fallback and activation race
        run: python3 -m unittest discover -s automation -p 'test_sidj_telegram.py' -v
      - name: Verify manual Cloudflare operations without credentials
        run: python3 -m unittest discover -s automation -p 'test_sidj_cloudflare*.py' -v
      - name: Verify committed download checksums
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          ref = json.loads(Path('automation/sidj_projects.json').read_text())['files_ref']
          if not re.fullmatch(r'[0-9a-f]{40}', ref):
              raise SystemExit('Invalid files_ref')
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', ref], check=True)
          PY
          python3 automation/update_sidj_catalog.py --check
      - name: Install pinned Worker tooling
        working-directory: cloudflare/sidj-worker
        run: npm ci --ignore-scripts
      - name: Check JavaScript, behavior and deployment bundle
        working-directory: cloudflare/sidj-worker
        run: |
          npm run check
          npm test
          npm run deploy:check

  # One-time release approved for PR #15, after full CI succeeds on main.
  # The exact squash title makes this job inert for future commits.
  release_pr16:
    needs: check
    if: >-
      github.event_name == 'push' &&
      github.repository == 'berserkerxxxl/Berserker-SiDj-Technologies' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'fix: publish Telegram /pr to correct Cloudflare Worker (#16)')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    concurrency:
      group: sidj-telegram-commands
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/sidj-worker/package-lock.json
      - name: Install pinned Cloudflare tooling
        working-directory: cloudflare/sidj-worker
        run: npm ci --ignore-scripts
      - name: Check existing Worker and deploy code only (preserve vars and secrets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SIDJ_FREE_PLAN_CONFIRMED: 'yes'
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import time
          from pathlib import Path
          from urllib.request import Request
          from automation.sidj_cloudflare import HTTP, USER_AGENT
          url = 'https://bs-tech-sidj.berserkerxxxl.workers.dev/'
          if (not os.environ.get('CLOUDFLARE_API_TOKEN')
                  or not re.fullmatch(r'[0-9a-fA-F]{32}', os.environ.get('CLOUDFLARE_ACCOUNT_ID', ''))
                  or os.environ.get('SIDJ_FREE_PLAN_CONFIRMED') != 'yes'):
              raise SystemExit('Cloudflare credentials or Free plan confirmation missing.')
          try:
              with HTTP.open(Request(url, headers={'User-Agent': USER_AGENT}), timeout=15) as res:
                  body = res.read(4096).decode('utf-8', 'replace')
                  if res.status != 200 or 'Worker доступен.' not in body:
                      raise ValueError('Existing Worker health cannot be confirmed.')
          except Exception:
              raise SystemExit('Existing Worker preflight failed; no deploy attempted.') from None
          worker_dir = (Path.cwd() / 'cloudflare' / 'sidj-worker').resolve()
          config = worker_dir / 'wrangler.toml'
          binary = worker_dir / 'node_modules' / '.bin' / 'wrangler'
          if not config.is_file() or not binary.is_file():
              raise SystemExit('Worker config or Wrangler executable missing. No deploy attempted.')
          command = [
              str(binary), 'deploy', '--config', str(config), '--name', 'bs-tech-sidj',
              '--keep-vars', '--var', 'SIDJ_PUBLIC_URL:' + url,
          ]
          try:
              proc = subprocess.run(command, cwd=worker_dir,
                                    capture_output=True, text=True, timeout=180)
          except (OSError, subprocess.TimeoutExpired):
              raise SystemExit('Cloudflare deploy did not complete; verify Workers dashboard.') from None
          if proc.returncode:
              raise SystemExit('Cloudflare code deploy failed; existing Worker was not intentionally removed.')
          print('Wrangler returned success; verifying the live Worker before menu update.')
          ready = False
          for attempt in range(10):
              try:
                  with HTTP.open(Request(url + 'setup', headers={'User-Agent': USER_AGENT}), timeout=12) as res:
                      html = res.read(32769).decode('utf-8', 'replace')
                      ready = (res.status == 200 and len(html) <= 32768
                               and 'Обновить меню команд' in html)
                  if ready:
                      break
              except Exception:
                  pass
              if attempt < 9:
                  time.sleep(6)
          if not ready:
              raise SystemExit('Live Worker lacks the new /setup marker; Telegram menu left unchanged.')
          print('Live Worker verified: new /setup menu control is present.')
          PY
      - name: Refresh private Telegram command menu only after successful deploy
        env:
          SIDJ_TELEGRAM_BOT_TOKEN: ${{ secrets.SIDJ_TELEGRAM_BOT_TOKEN }}
          SIDJ_TELEGRAM_CHAT_ID: ${{ secrets.SIDJ_TELEGRAM_CHAT_ID }}
        run: |
          node --input-type=module -e "import {COMMANDS} from './cloudflare/sidj-worker/src/index.js'; import {writeFileSync} from 'node:fs'; writeFileSync('/tmp/sidj-pr16-commands.json', JSON.stringify(COMMANDS));"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          token = os.environ.get('SIDJ_TELEGRAM_BOT_TOKEN', '')
          chat = os.environ.get('SIDJ_TELEGRAM_CHAT_ID', '')
          if not re.fullmatch(r'[0-9]{5,16}:[A-Za-z0-9_-]{20,}', token) or not re.fullmatch(r'[1-9][0-9]{0,15}', chat):
              raise SystemExit('Telegram owner credentials missing or invalid.')
          if int(chat) > 9007199254740991:
              raise SystemExit('Telegram chat ID is outside supported integer range.')
          commands = json.loads(Path('/tmp/sidj-pr16-commands.json').read_text(encoding='utf-8'))
          if not isinstance(commands, list) or not any(c.get('command') == 'pr' for c in commands):
              raise SystemExit('The new /pr command is not present in the source.')
          scope = {'type': 'chat', 'chat_id': int(chat)}
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Telegram API redirect blocked.')
          opener = build_opener(NoRedirect())
          def telegram(method, data=None):
              payload = None if data is None else json.dumps(data).encode('utf-8')
              request = Request(
                  'https://api.telegram.org/bot' + token + '/' + method,
                  data=payload,
                  headers={'Content-Type': 'application/json', 'User-Agent': 'B-S-tech-SiDj-menu-release'},
                  method='POST' if data is not None else 'GET',
              )
              try:
                  with opener.open(request, timeout=18) as res:
                      body = res.read(32769)
              except HTTPError as exc:
                  raise RuntimeError('Telegram API rejected operation: HTTP ' + str(exc.code)) from None
              except (URLError, TimeoutError, OSError):
                  raise RuntimeError('Telegram API unavailable; menu refresh not confirmed.') from None
              if len(body) > 32768:
                  raise RuntimeError('Telegram API response too large.')
              try:
                  value = json.loads(body)
              except (ValueError, TypeError):
                  raise RuntimeError('Telegram API response invalid.') from None
              if not isinstance(value, dict) or value.get('ok') is not True:
                  raise RuntimeError('Telegram API did not confirm operation.')
              return value.get('result')
          try:
              bot = telegram('getMe')
              info = telegram('getWebhookInfo')
              owner = telegram('getChat', {'chat_id': int(chat)})
              if (not isinstance(bot, dict) or bot.get('username', '').casefold() != 'bs_sidj_bot'
                      or not isinstance(info, dict)
                      or info.get('url') != 'https://bs-tech-sidj.berserkerxxxl.workers.dev/telegram'
                      or not isinstance(owner, dict)
                      or owner.get('type') != 'private' or owner.get('id') != int(chat)):
                  raise RuntimeError('Bot, owner chat or webhook mismatch; menu left unchanged.')
              telegram('setMyCommands', {'commands': commands, 'scope': scope})
              current = telegram('getMyCommands', {'scope': scope})
              if current != commands:
                  raise RuntimeError('Telegram menu update was not verified.')
          except RuntimeError as exc:
              raise SystemExit(str(exc)) from None
          print('Telegram menu verified: /pr available in private owner chat; webhook unchanged.')
          PY
