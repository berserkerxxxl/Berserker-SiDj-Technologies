name: Package B/S Reserve Alpha

on:
  push:
    branches:
      - publish/bs-reserve-alpha-20261028
    paths:
      - .release/bs-reserve-alpha/**
      - .github/workflows/package-reserve-alpha.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-bs-reserve-alpha
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: publish/bs-reserve-alpha-20261028
      - name: Assemble and verify release ZIP
        run: python .release/bs-reserve-alpha/assemble.py
      - name: Store the complete verified download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/BS_Reserve_0.1.0-alpha.1_build20261028.2_win64.zip
          git rm --ignore-unmatch .release/bs-reserve-alpha/part-*.bin
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Assemble verified B/S Reserve 0.1.0-alpha.1 download"
          git push origin HEAD:publish/bs-reserve-alpha-20261028
