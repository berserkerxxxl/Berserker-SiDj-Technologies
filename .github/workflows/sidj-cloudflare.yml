name: SiDj Cloudflare - manual operations
run-name: 'SiDj Cloudflare: ${{ inputs.operation }}'

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Операция (сначала deploy, затем status, затем activate)'
        type: choice
        options: [deploy, status, activate, rollback]
        default: deploy
        required: true
      confirm_free_plan:
        description: 'Я проверил, что в Cloudflare используется Workers Free'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Require explicit Workers Free confirmation
        env:
          FREE_CONFIRMED: ${{ inputs.confirm_free_plan }}
        run: |
          if [ "$FREE_CONFIRMED" != 'true' ]; then
            echo '::error::Проверь тариф Workers Free и отметь подтверждение в форме запуска. Облачные операции не выполнены.'
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/sidj-worker/package-lock.json
      - name: Test operations without credentials
        run: python3 -m unittest discover -s automation -p 'test_sidj_cloudflare.py' -v
      - name: Check Worker without credentials
        working-directory: cloudflare/sidj-worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run deploy:check

  operate:
    needs: check
    if: github.ref == 'refs/heads/main' && inputs.confirm_free_plan
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    # Same group as the old polling workflow: they never operate concurrently.
    concurrency:
      group: sidj-telegram-commands
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/sidj-worker/package-lock.json
      - name: Install pinned deployment tooling
        working-directory: cloudflare/sidj-worker
        run: npm ci --ignore-scripts
      - name: Run selected Cloudflare operation
        env:
          SIDJ_OPERATION: ${{ inputs.operation }}
          SIDJ_FREE_PLAN_CONFIRMED: 'yes'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SIDJ_TELEGRAM_BOT_TOKEN: ${{ secrets.SIDJ_TELEGRAM_BOT_TOKEN }}
          SIDJ_TELEGRAM_CHAT_ID: ${{ secrets.SIDJ_TELEGRAM_CHAT_ID }}
          SIDJ_ADMIN_TOKEN: ${{ secrets.SIDJ_ADMIN_TOKEN }}
        run: python3 automation/sidj_cloudflare.py "$SIDJ_OPERATION"
