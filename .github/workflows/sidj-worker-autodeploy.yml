name: SiDj - deploy Worker code from main

on:
  push:
    branches: [main]
    # No docs, monitoring state, GitHub workflows or unrelated app releases.
    paths:
      - 'cloudflare/sidj-worker/src/**'
      - 'cloudflare/sidj-worker/wrangler.toml'
      - 'cloudflare/sidj-worker/package.json'
      - 'cloudflare/sidj-worker/package-lock.json'
      - 'automation/sidj_projects.json'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/sidj-worker/package-lock.json
      - name: Check public files and polling fallback
        run: |
          python3 automation/check_sidj_secrets.py
          python3 -m unittest discover -s automation -p 'test_sidj_telegram.py' -v
          python3 -m unittest discover -s automation -p 'test_sidj_cloudflare*.py' -v
          python3 -m unittest discover -s automation -p 'test_sidj_worker_monitor.py' -v
      - name: Check immutable catalog
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          ref = json.loads(Path('automation/sidj_projects.json').read_text())['files_ref']
          if not re.fullmatch(r'[0-9a-f]{40}', ref):
              raise SystemExit('Invalid catalog ref')
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', ref], check=True)
          PY
          python3 automation/update_sidj_catalog.py --check
      - name: Check JS, behavior and bundle before publishing
        working-directory: cloudflare/sidj-worker
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run deploy:check

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    concurrency:
      group: sidj-telegram-commands
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/sidj-worker/package-lock.json
      - name: Install pinned deployment tooling
        working-directory: cloudflare/sidj-worker
        run: npm ci --ignore-scripts
      - name: Publish code only; retain existing secrets and webhook
        env:
          SIDJ_FREE_PLAN_CONFIRMED: 'yes'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 automation/sidj_cloudflare.py auto_deploy
